<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuromaru | Minecraft Server Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { -ms-overflow-style: none; scrollbar-width: none; box-sizing: border-box; touch-action: manipulation; }
        *::-webkit-scrollbar { display: none; }

        body { margin: 0; padding: 0; background-color: #40444B; color: #ffffff; font-family: "BIZ UDPGothic", sans-serif; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; padding-top: 56px; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #40444B; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .header { position: fixed; top: 0; width: 100%; max-width: 480px; height: 56px; background-color: #2C2F33; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; }
        .header-title { font-size: 18px; font-weight: bold; flex-grow: 1; text-align: center; letter-spacing: 0.05em; }
        .nav-icon-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; }

        .menu-list { position: absolute; top: 56px; left: 0; width: 100%; background-color: #2C2F33; display: flex; flex-direction: column; z-index: 999; opacity: 0; visibility: hidden; transform: translateY(-20px); transition: all 0.3s ease; }
        .menu-list.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .menu-item { display: flex; align-items: center; padding: 15px 20px; text-decoration: none; color: #eee; font-size: 14px; border-bottom: 1px solid #40444B; }

        .image-wrapper { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background-color: #000; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        /* グリッドメニュー */
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; background-color: #2C2F33; margin: 15px; margin-bottom:3px; border-radius: 16px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #eee; font-size: 12px; cursor: pointer; }
        .icon-box { width: 50px; height: 50px; background-color: #40444B; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 8px; font-size: 24px; }

        /* --- 追加：スライドショーのスタイル --- */
        .slider-section {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }
        .slider-container {
            width: 100%;
            aspect-ratio: 21 / 9; /* 指定のサイズ比 */
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            margin-bottom: -15px;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        
        .slide-link {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }
        .slide-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* インジケーター（点） */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            position: absolute;
            bottom: 8px;
            width: 100%;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0);
            border-radius: 50%;
            transition: 0.3s;
        }
        .dot.active { background: #ffffff00; width: 12px; border-radius: 4px; }

        .news-container { flex-grow: 1; padding: 0px 15px 20px 15px; display: flex; flex-direction: column; }
        .news-frame { width: 100%; height: 400px; border: none; border-radius: 12px; background-color: transparent; }
        .footer-info { text-align: center; font-size: 12px; color: #888; padding: 20px 0 40px 0; }

        /* モーダル */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background-color: #2F3136; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-text { font-size: 14px; line-height: 1.6; color: #dcddde; margin-bottom: 24px; text-align: left; }
        .modal-text a { color: #00b0f4; text-decoration: none; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; }
        .btn-main { background-color: #5865F2; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-sub { background: none; color: #aaa; border: none; padding: 10px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <header class="header">
        <div style="width: 44px;"></div>
        <div class="header-title">Kuromaru</div>
        <button class="nav-icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <nav class="menu-list" id="menuList">
            <a href="index.html" class="menu-item"><i class="fas fa-home"></i> ホーム</a>
            <a href="map.html" class="menu-item"><i class="fas fa-map-marked-alt"></i> ライブマップ</a>
            <a href="template.html" class="menu-item"><i class="fas fa-file-alt"></i> サーバー規約</a>

    </header>

    <div class="container">
        <!-- <div class="image-wrapper"><img src="01.png" alt="Kuromaru"></div> -->

        <div class="slider-section">
            <div class="slider-container" id="slider">
                <a href="#" class="slide-link"><img src="slide/スライド1.png" alt="Slide 1"></a>
                <a href="#" class="slide-link"><img src="slide/スライド2.png" alt="Slide 2"></a>
                <a href="#" class="slide-link"><img src="slide/スライド3.png" alt="Slide 3"></a>
            </div>
            <div class="slider-dots" id="dotsContainer">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        
        <div class="app-grid">
            <a href="https://kuromaru.game-info.wiki/d/%a5%b5%a1%bc%a5%d0%a1%bc%a4%ce%c6%fe%a4%ea%ca%fd" class="grid-item"><div class="icon-box" style="color: #ff8000;"><i class="fas fa-sign-in-alt"></i></div><span>参加方法</span></a>
            <a href="map.html" class="grid-item"><div class="icon-box" style="color: #4cd137;"><i class="fas fa-map-marked-alt"></i></div><span>マップ</span></a>
            <a href="template.html" class="grid-item"><div class="icon-box" style="color: #fbc531;"><i class="fas fa-book"></i></div><span>ルール</span></a>
            <div class="grid-item" id="discordLink"><div class="icon-box" style="color: #7289da;"><i class="fab fa-discord"></i></div><span>Discord</span></div>
            <a href="#" class="grid-item"><div class="icon-box" style="color: #ffffff;"><i class="fab fa-x-twitter"></i></div><span>公式X</span></a>
            <a href="#" class="grid-item"><div class="icon-box" style="color: #888;"><i class="fas fa-plus"></i></div><span>追加中</span></a>
            <a href="#" class="grid-item"><div class="icon-box" style="color: #888;"><i class="fas fa-plus"></i></div><span>追加中</span></a>
            <a href="#" class="grid-item"><div class="icon-box" style="color: #888;"><i class="fas fa-plus"></i></div><span>追加中</span></a>
        </div>

        <div class="news-container">
            <h3 style="margin-left: 5px; font-size: 16px;">サーバーニュース</h3>
            <iframe src="news.html" class="news-frame"></iframe>
        </div>

        <div class="footer-info">(C) Kuromaru</div>
    </div>

    <div class="modal-overlay" id="discordModal">
        <div class="modal-content">
            <div style="font-size: 24px; color: #5865F2; margin-bottom: 15px;"><i class="fab fa-discord"></i></div>
            <div class="modal-text">
                公式Discordコミュニティへは、同社の規約に基づき<b>13歳以上の方のみ</b>が参加できます。詳しくは<a href="https://discord.com/terms" target="_blank" rel="noopener">Discordサービス利用規約</a>をお読みください。
            </div>
            <div class="modal-btns">
                <button class="btn-main" id="btnContinue">続ける</button>
                <button class="btn-sub" id="btnCancel">キャンセル</button>
            </div>
        </div>
    </div>

    <script>
        // メニュー開閉
        const menuBtn = document.getElementById('menuBtn');
        const menuList = document.getElementById('menuList');
        const menuBtnIcon = menuBtn.querySelector('i');
        menuBtn.addEventListener('click', () => {
            menuList.classList.toggle('show');
            if(menuList.classList.contains('show')){ menuBtnIcon.classList.replace('fa-bars', 'fa-times'); }
            else { menuBtnIcon.classList.replace('fa-times', 'fa-bars'); }
        });

        // Discordモーダル
        const discordLink = document.getElementById('discordLink');
        const modal = document.getElementById('discordModal');
        const btnContinue = document.getElementById('btnContinue');
        const btnCancel = document.getElementById('btnCancel');

        discordLink.addEventListener('click', () => { modal.style.display = 'flex'; });
        btnCancel.addEventListener('click', () => { modal.style.display = 'none'; });
        btnContinue.addEventListener('click', () => {
            window.open('https://discord.com/invite/3cPMXcdGKd', '_blank');
            modal.style.display = 'none';
        });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

        /* --- スライドショー自動再生 & インジケーター制御 --- */
        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot');
        let currentIndex = 0;
        const slideCount = dots.length;

        // 自動スライド
        function autoSlide() {
            currentIndex = (currentIndex + 1) % slideCount;
            updateSlider();
        }

        function updateSlider() {
            const scrollAmount = slider.clientWidth * currentIndex;
            slider.scrollTo({ left: scrollAmount, behavior: 'smooth' });
            updateDots();
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        let slideInterval = setInterval(autoSlide, 4000); // 4秒ごとに切り替え

        // 手動スクロール検知（インジケーター同期）
        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / slider.clientWidth);
            if (index !== currentIndex) {
                currentIndex = index;
                updateDots();
            }
        });

        // タッチ中は自動再生を一時停止
        slider.addEventListener('touchstart', () => clearInterval(slideInterval));
        slider.addEventListener('touchend', () => {
            clearInterval(slideInterval);
            slideInterval = setInterval(autoSlide, 4000);
        });
    </script>
</body>
