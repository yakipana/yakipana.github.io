<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALORIE100</title>
  
  <!-- Material 3 Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  
  <style>
    /* Material Design 3 Color Tokens */
    :root {
      --md-sys-color-primary: #006874;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #97f0ff;
      --md-sys-color-on-primary-container: #001f24;
      --md-sys-color-background: #fbfdfd;
      --md-sys-color-on-background: #191c1d;
      --md-sys-color-surface: #fbfdfd;
      --md-sys-color-on-surface: #191c1d;
      --md-sys-color-surface-variant: #dbe4e6;
      --md-sys-color-on-surface-variant: #3f484a;
      --md-sys-color-outline: #6f797a;
      --md-sys-color-surface-container: #eff5f5;
      --md-sys-color-surface-container-high: #e9efef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* PCでも崩れないように最大幅を制限して中央配置 */
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }

    /* アプリバー（タイトル＆リセットボタン） */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 500; margin: 0; }
    h2 { font-size: 16px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 8px; }

    /* Cards */
    .card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: 24px;
      padding: 20px;
    }
    .card.result-card {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      text-align: center;
      padding: 24px 20px;
    }

    /* Outlined Text Fields */
    .input-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      position: relative;
      flex: 1; /* 横並び時に均等に幅を取る */
    }
    .input-group.full-width {
      margin-top: 20px;
    }
    .input-group label {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      position: absolute;
      top: -8px;
      left: 12px;
      background: var(--md-sys-color-surface-container);
      padding: 0 4px;
      z-index: 1;
    }
    input[type="number"] {
      width: 100%;
      background-color: transparent;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 4px;
      padding: 16px 36px 16px 12px; /* 単位が被らないように右余白を調整 */
      font-size: 16px;
      color: var(--md-sys-color-on-background);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: var(--md-sys-color-primary);
      border-width: 2px;
      padding: 15px 35px 15px 11px; /* ボーダーが太くなった分の調整 */
    }
    .suffix {
      position: absolute;
      right: 12px;
      top: 16px;
      color: var(--md-sys-color-on-surface-variant);
      pointer-events: none;
    }

    /* Buttons */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    .btn-text {
      background: transparent;
      border: none;
      color: var(--md-sys-color-primary);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s;
    }
    .btn-text:hover, .btn-text:active {
      background-color: rgba(0, 104, 116, 0.08);
    }
    .btn-filled {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: 100px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 240px;
      margin-top: 16px;
      height: 48px;
    }
    .btn-filled:hover, .btn-filled:active {
      opacity: 0.9;
    }

    /* Results area */
    .result-cal {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.2;
      margin: 8px 0;
    }
    .result-salt {
      font-size: 16px;
      margin-bottom: 8px;
      min-height: 24px; /* 入力がない時も高さを保持 */
    }

    /* Dialog (Material 3 Style) */
    dialog {
      border: none;
      border-radius: 28px;
      background-color: var(--md-sys-color-surface-container-high);
      padding: 24px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      color: var(--md-sys-color-on-surface);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.4);
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 24px;
    }
    dialog .input-group label {
      background: var(--md-sys-color-surface-container-high);
    }

    /* Snackbar (Toast) */
    #snackbar {
      visibility: hidden;
      min-width: 250px;
      background-color: #313033;
      color: #f4eff4;
      text-align: center;
      border-radius: 4px;
      padding: 14px;
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14);
    }
    #snackbar.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }
    @keyframes fadein {
      from {bottom: 0; opacity: 0;}
      to {bottom: 30px; opacity: 1;}
    }
    @keyframes fadeout {
      from {bottom: 30px; opacity: 1;}
      to {bottom: 0; opacity: 0;}
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <h1>100gあたりのカロリーから計算</h1>
    <button id="reset-btn" class="btn-text">
      <span class="material-symbols-outlined" style="font-size: 18px;">refresh</span>
      リセット
    </button>
  </div>

  <!-- 1. 基準値入力カード -->
  <div class="card">
    <div class="header-row">
      <h2>
        <span class="material-symbols-outlined">restaurant</span>
        <span id="base-weight-display">100</span>g あたりの成分
      </h2>
      <button id="edit-btn" class="btn-text">
        <span class="material-symbols-outlined" style="font-size: 18px;">edit</span>
        編集
      </button>
    </div>

    <!-- カロリーと塩分を横並びにするコンテナ -->
    <div class="input-row">
      <div class="input-group">
        <label>カロリー *必須</label>
        <input type="number" id="input-cal" placeholder="0" inputmode="decimal">
        <span class="suffix">kcal</span>
      </div>

      <div class="input-group">
        <label>塩分 *任意</label>
        <input type="number" id="input-salt" placeholder="0" inputmode="decimal">
        <span class="suffix">g</span>
      </div>
    </div>
  </div>

  <!-- 2. はかったグラム数カード -->
  <div class="card">
    <h2>
      <span class="material-symbols-outlined">scale</span>
      はかったグラム数
    </h2>
    <div class="input-group full-width">
      <label>重量</label>
      <input type="number" id="input-weight" placeholder="0" inputmode="decimal">
      <span class="suffix">g</span>
    </div>
  </div>

  <!-- 3. 結果表示＆コピーカード -->
  <div class="card result-card">
    <div style="font-size: 14px; font-weight: 500;">計算結果</div>
    <div class="result-cal" id="result-cal">0 <span style="font-size: 20px;">kcal</span></div>
    <div class="result-salt" id="result-salt"></div>
    
    <button id="copy-btn" class="btn-filled">
      <span class="material-symbols-outlined">content_copy</span>
      結果をコピー
    </button>
  </div>
</div>

<br>

<!-- 基準グラム数変更ダイアログ -->
<dialog id="edit-dialog">
  <h3 style="margin-top: 0; font-size: 18px; font-weight: 500;">基準グラム数の変更</h3>
  <p style="font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 20px;">
    食品パッケージの表記に合わせたグラム数を入力してください。
  </p>
  <div class="input-group full-width" style="margin-top: 0;">
    <label>基準となる重量</label>
    <input type="number" id="input-new-base" value="100" inputmode="decimal">
    <span class="suffix">g</span>
  </div>
  <div class="dialog-actions">
    <button class="btn-text" id="dialog-cancel">キャンセル</button>
    <button class="btn-text" id="dialog-save" style="font-weight: 700;">保存</button>
  </div>
</dialog>

<!-- コピー完了通知用スナックバー -->
<div id="snackbar">コピーしました</div>


<script>
  let baseWeight = 100;
  let calculatedCal = 0;
  let calculatedSalt = null;

  const inputCal = document.getElementById('input-cal');
  const inputSalt = document.getElementById('input-salt');
  const inputWeight = document.getElementById('input-weight');
  const resultCal = document.getElementById('result-cal');
  const resultSalt = document.getElementById('result-salt');
  const copyBtn = document.getElementById('copy-btn');
  const resetBtn = document.getElementById('reset-btn');
  
  const editBtn = document.getElementById('edit-btn');
  const editDialog = document.getElementById('edit-dialog');
  const inputNewBase = document.getElementById('input-new-base');
  const dialogCancel = document.getElementById('dialog-cancel');
  const dialogSave = document.getElementById('dialog-save');
  const baseWeightDisplay = document.getElementById('base-weight-display');
  const snackbar = document.getElementById('snackbar');

  function calculate() {
    const cal = parseFloat(inputCal.value);
    const salt = parseFloat(inputSalt.value);
    const weight = parseFloat(inputWeight.value);

    if (!isNaN(cal) && !isNaN(weight) && baseWeight > 0) {
      calculatedCal = Math.round((cal / baseWeight) * weight);
      resultCal.innerHTML = `${calculatedCal} <span style="font-size: 20px;">kcal</span>`;

      if (!isNaN(salt)) {
        calculatedSalt = Math.round(((salt / baseWeight) * weight) * 10) / 10;
        resultSalt.textContent = `塩分: ${calculatedSalt} g`;
      } else {
        calculatedSalt = null;
        resultSalt.textContent = '';
      }
    } else {
      resultCal.innerHTML = `0 <span style="font-size: 20px;">kcal</span>`;
      resultSalt.textContent = '';
      calculatedCal = 0;
      calculatedSalt = null;
    }
  }

  inputCal.addEventListener('input', calculate);
  inputSalt.addEventListener('input', calculate);
  inputWeight.addEventListener('input', calculate);

  // リセット処理
  resetBtn.addEventListener('click', () => {
    inputCal.value = '';
    inputSalt.value = '';
    inputWeight.value = '';
    calculate();
  });

  editBtn.addEventListener('click', () => {
    inputNewBase.value = baseWeight;
    editDialog.showModal();
  });

  dialogCancel.addEventListener('click', () => {
    editDialog.close();
  });

  dialogSave.addEventListener('click', () => {
    const newBase = parseFloat(inputNewBase.value);
    if (!isNaN(newBase) && newBase > 0) {
      baseWeight = newBase;
      baseWeightDisplay.textContent = baseWeight;
      calculate(); 
    }
    editDialog.close();
  });

  copyBtn.addEventListener('click', () => {
    const cal = parseFloat(inputCal.value);
    const weight = parseFloat(inputWeight.value);
    if (isNaN(cal) || isNaN(weight)) return;

    let copyText = `${calculatedCal}kcal`;
    if (calculatedSalt !== null) {
      copyText = `${calculatedCal}kcal / ${calculatedSalt}g`;
    }

    navigator.clipboard.writeText(copyText).then(() => {
      showSnackbar(`「${copyText}」をコピーしました`);
    }).catch(err => {
      console.error('コピーに失敗しました', err);
      showSnackbar('コピーに失敗しました');
    });
  });

  function showSnackbar(msg) {
    snackbar.textContent = msg;
    snackbar.className = "show";
    setTimeout(() => { 
      snackbar.className = snackbar.className.replace("show", ""); 
    }, 3000);
  }
</script>
</body>
</html>
