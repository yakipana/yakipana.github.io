<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>現在地追従マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --ui-bg: rgba(51,51,51,.92); --ui-fg: #fff; --fs: clamp(28px, 9vmin, 84px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0; background: #ddd;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    /* 文字のなぞり(選択)・長押しメニュー禁止 */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #map { position: absolute; inset: 0; background: #ddd; }

  .ui { position: absolute; z-index: 1000; color: var(--ui-fg); background: var(--ui-bg);
        border-radius: calc(var(--fs) * .22); pointer-events: none; }

  /* 速度計: 右寄せ、3桁(199)+km/h が収まる固定幅 */
  #speed { top: max(env(safe-area-inset-top), 2.2vmin); right: max(env(safe-area-inset-right), 2.2vmin);
           width: 3.7em; padding: .12em .25em .1em; font-size: var(--fs);
           display: flex; justify-content: flex-end; align-items: baseline; white-space: nowrap;
           line-height: 1.1; }
  #speed .num { font-size: 1em; font-weight: 500; font-variant-numeric: tabular-nums; }
  #speed .unit { font-size: .5em; font-weight: 500; margin-left: .06em; }

  /* 時計 */
  #clock { bottom: max(env(safe-area-inset-bottom), 2.2vmin); left: max(env(safe-area-inset-left), 2.2vmin);
           padding: .08em .22em .05em; font-size: var(--fs); white-space: nowrap; line-height: 1.15;
           font-variant-numeric: tabular-nums; font-weight: 500; }
  #clock .sec { font-size: .6em; }

  /* 縮尺ボタン */
  #zoom { position: absolute; z-index: 1000;
          right: max(env(safe-area-inset-right), 2.2vmin); bottom: max(env(safe-area-inset-bottom), 2.2vmin);
          display: flex; flex-direction: column; gap: 1.2vmin; }
  #zoom button { width: clamp(48px, 12vmin, 96px); height: clamp(48px, 12vmin, 96px); border-radius: 50%;
          border: 2px solid #333; background: rgba(238,238,238,.95); padding: 0; position: relative;
          touch-action: manipulation; }
  #zoom button:active { background: #cfcfcf; }
  #zoom button::before, #zoom button::after { content: ""; position: absolute; left: 50%; top: 50%;
          background: #111; transform: translate(-50%, -50%); border-radius: 2px; }
  #zoom button::before { width: 46%; height: 7%; }
  #zoom #zin::after { width: 7%; height: 46%; }

  /* 現在地へ戻る */
  #recenter { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%);
          bottom: max(calc(env(safe-area-inset-bottom) + 3vmin), 6vmin);
          display: none; padding: .7em 1.4em; font-size: clamp(15px, 3.6vmin, 26px); font-weight: 600;
          color: #fff; background: #1a73e8; border: none; border-radius: 999px;
          box-shadow: 0 2px 10px rgba(0,0,0,.35); touch-action: manipulation; }
  #recenter.show { display: block; }

  #toast { position: absolute; z-index: 1000; left: 50%; top: 4vmin; transform: translateX(-50%);
          max-width: 70vw; padding: .5em 1em; border-radius: 8px; background: rgba(180,30,30,.92); color: #fff;
          font-size: clamp(13px, 3vmin, 22px); display: none; text-align: center; }

  /* 現在地マーカー */
  .me { width: 100%; height: 100%; border-radius: 50%; background: #4aa8ea;
        border: 3px solid #fff; box-shadow: 0 0 6px rgba(0,0,0,.4); }

  /* 著作権表記(OSM必須)は下中央に小さく */
  .leaflet-bottom.leaflet-right { right: 50%; transform: translateX(50%); }
  .leaflet-control-attribution { font-size: 10px; opacity: .8; }
  .leaflet-container { touch-action: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="speed" class="ui"><span class="num" id="spd">0</span><span class="unit">km/h</span></div>
<div id="clock" class="ui"><span id="hm">00:00</span><span class="sec" id="ss">00</span></div>
<div id="zoom">
  <button id="zin" aria-label="拡大"></button>
  <button id="zout" aria-label="縮小"></button>
</div>
<button id="recenter">現在地へ戻る</button>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  // ---------- 地図 ----------
  const map = L.map('map', {
    center: [34.6833, 135.5106], zoom: 17, minZoom: 3, maxZoom: 19,
    zoomControl: false,
    touchZoom: false, doubleClickZoom: false, scrollWheelZoom: false, boxZoom: false, keyboard: false,
    tap: false, inertia: true, attributionControl: true
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const size = Math.round(Math.min(innerWidth, innerHeight) * 0.07);
  const dot = Math.max(28, Math.min(size, 56));
  const marker = L.marker(map.getCenter(), {
    icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [dot, dot], iconAnchor: [dot/2, dot/2] }),
    interactive: false, keyboard: false, zIndexOffset: 1000
  }).addTo(map);

  // ---------- 追従制御 ----------
  const btn = document.getElementById('recenter');
  let following = true, last = null;   // last: {lat, lng}

  map.on('dragstart', () => { following = false; btn.classList.add('show'); });
  btn.addEventListener('click', () => {
    following = true; btn.classList.remove('show');
    if (last) map.setView([last.lat, last.lng], map.getZoom(), { animate: true });
  });

  document.getElementById('zin').addEventListener('click', () => map.zoomIn(1));
  document.getElementById('zout').addEventListener('click', () => map.zoomOut(1));

  // ---------- 速度計 ----------
  const spdEl = document.getElementById('spd');
  let prev = null, lastFixAt = 0, shown = 0;

  function setSpeed(kmh) {
    shown = Math.max(0, Math.min(199, Math.round(kmh)));
    spdEl.textContent = shown;
  }
  function distM(a, b) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function onPos(p) {
    const c = p.coords, now = { lat: c.latitude, lng: c.longitude, t: p.timestamp, acc: c.accuracy };
    last = now; lastFixAt = Date.now();

    // 速度: 端末提供値があれば優先、なければ前回との距離/時間から計算
    let v = null;
    if (typeof c.speed === 'number' && isFinite(c.speed)) v = c.speed * 3.6;
    else if (prev && now.t > prev.t) {
      const d = distM(prev, now), dt = (now.t - prev.t) / 1000;
      v = d < Math.max(2, (c.accuracy || 0) * 0.3) ? 0 : (d / dt) * 3.6;
    }
    if (v !== null) setSpeed(v);
    prev = now;

    marker.setLatLng([now.lat, now.lng]);
    if (following) map.panTo([now.lat, now.lng], { animate: true, duration: 0.5, easeLinearity: 1, noMoveStart: true });
    hideToast();
  }

  const toast = document.getElementById('toast');
  function showToast(m) { toast.textContent = m; toast.style.display = 'block'; }
  function hideToast() { toast.style.display = 'none'; }
  function onErr(e) {
    showToast(e.code === 1 ? '位置情報の利用が許可されていません' : '位置情報を取得できません');
  }

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
  } else showToast('この端末は位置情報に対応していません');

  // 更新が止まったら速度を0に
  setInterval(() => { if (lastFixAt && Date.now() - lastFixAt > 4000 && shown !== 0) setSpeed(0); }, 1000);

  // ---------- 時計(秒まで) ----------
  const hm = document.getElementById('hm'), ss = document.getElementById('ss');
  const p2 = n => String(n).padStart(2, '0');
  function tick() {
    const d = new Date();
    hm.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
    ss.textContent = p2(d.getSeconds());
  }
  tick(); setInterval(tick, 200);

  // ---------- 画面スリープ防止 ----------
  async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (_) {} }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // ---------- ピンチ・選択の禁止 ----------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  addEventListener('resize', () => map.invalidateSize());
})();
</script>
</body>
</html>
